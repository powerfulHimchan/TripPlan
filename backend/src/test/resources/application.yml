spring:
  datasource:
    url: jdbc:h2:mem:tripplan;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
tripplan:
  auth:
    jwt-secret: tripplan-test-secret-key-at-least-32-bytes-long
    token-valid-days: 1
  notification:
    fcm-enabled: false
